<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Marco -->
  <rect x="4" y="4" width="1192" height="622" fill="none" stroke="#e8c547" stroke-width="2"/>

  <!-- Logo ND -->
  <text x="60" y="300" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="700" fill="#f5f5f0" letter-spacing="-4">ND</text>
  <rect x="300" y="150" width="8" height="170" fill="#e8c547"/>

  <!-- Bloque derecho -->
  <text x="430" y="128" font-family="Consolas, Monaco, monospace" font-size="20" letter-spacing="4" fill="#e8c547">NESTDEV.PRO</text>
  <rect x="430" y="140" width="150" height="2" fill="#e8c547" opacity="0.7"/>

  <text x="428" y="212" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#f5f5f0">SOLUCIONES DIGITALES</text>
  <text x="428" y="272" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#e8c547">PARA TU NEGOCIO</text>

  <rect x="430" y="308" width="620" height="1" fill="#333333"/>

  <!-- Etiquetas del ecosistema -->
  <g font-family="Consolas, Monaco, monospace" font-size="16" fill="#cccccc">
    <rect x="430" y="340" width="92" height="36" rx="4" fill="none" stroke="#444444"/>
    <text x="446" y="363">ND|Web</text>

    <rect x="534" y="340" width="132" height="36" rx="4" fill="none" stroke="#444444"/>
    <text x="550" y="363">ND|Nexo·IA</text>

    <rect x="678" y="340" width="150" height="36" rx="4" fill="none" stroke="#444444"/>
    <text x="694" y="363">ND|Marketing</text>

    <rect x="840" y="340" width="92" height="36" rx="4" fill="none" stroke="#444444"/>
    <text x="856" y="363">ND|App</text>
  </g>

  <text x="430" y="418" font-family="Consolas, Monaco, monospace" font-size="18" letter-spacing="2" fill="#888888">MADRID, ESPAÑA</text>

  <!-- Marca inferior -->
  <text x="60" y="580" font-family="Consolas, Monaco, monospace" font-size="22" fill="#888888">nestdev.pro</text>

</svg>
